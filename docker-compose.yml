services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umkm_go_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "UMKM GO"
      APP_ENV: local
      APP_KEY: base64:yourAppKeyHere=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: umkm_go
      DB_USERNAME: umkm_user
      DB_PASSWORD: umkm_password
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules

  db:
    image: mariadb:10.11
    container_name: umkm_go_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: umkm_go
      MYSQL_USER: umkm_user
      MYSQL_PASSWORD: umkm_password
    volumes:
      - umkm_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umkm_data:
    driver: local
